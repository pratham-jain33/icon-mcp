[project]
name = "icon-mcp"
version = "0.1.0"
description = "MCP server: parametric Lucide icon sets for AI assistants. Search 2000+ icons, style them, batch-export SVG. Fully offline, no API key."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
]

[project.scripts]
icon-mcp = "icon_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["icon_mcp*"]

[tool.setuptools.package-data]
icon_mcp = ["icons/*.svg", "icon_index.json", "LUCIDE_LICENSE"]
